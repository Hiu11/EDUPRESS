name: E2E Autonomous AI Testing & CDN Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ai-e2e-test:
    name: Run Midscene.js AI E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        working-directory: ./client
        run: npm install
        
      - name: Install Playwright Browsers
        working-directory: ./client
        run: npx playwright install --with-deps chromium
        
      - name: Run AI Tests (Midscene.js)
        working-directory: ./client
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Cần cho Midscene.js AI Vision
        run: npx playwright test
        
      - name: Upload Test Video Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-video-report
          path: client/playwright-report/
          retention-days: 15

  deploy-edge-cdn:
    name: Deploy Frontend to Edge CDN
    needs: ai-e2e-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Vercel CLI
        run: npm install --global vercel
        
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project Artifacts (Nitro Edge Preset)
        working-directory: ./client
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Deploy Project Artifacts to Vercel
        working-directory: ./client
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
