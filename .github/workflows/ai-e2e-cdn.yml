name: E2E Autonomous AI Testing and CDN Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ai-e2e-test:
    name: Required smoke plus optional AI E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./client
        run: npx playwright install --with-deps chromium

      - name: Run required smoke tests
        working-directory: ./client
        run: npm run test:smoke

      - name: Run optional AI tests
        working-directory: ./client
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured. Skipping optional AI E2E tests."
            exit 0
          fi
          npm run test:ai

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-e2e-playwright-report
          path: client/playwright-report/
          retention-days: 15
