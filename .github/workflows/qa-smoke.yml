name: QA Smoke Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  local-smoke:
    name: Local frontend smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./client
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: ./client
        run: npm run build

      - name: Run smoke tests
        working-directory: ./client
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-smoke-playwright-report
          path: client/playwright-report/
          retention-days: 15

  production-smoke:
    name: Production deployment smoke
    runs-on: ubuntu-latest
    if: ${{ vars.PRODUCTION_FRONTEND_URL != '' && vars.PRODUCTION_API_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./client
        run: npx playwright install --with-deps chromium

      - name: Run deployed smoke tests
        working-directory: ./client
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
          SMOKE_API_BASE: ${{ vars.PRODUCTION_API_URL }}
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-playwright-report
          path: client/playwright-report/
          retention-days: 15
