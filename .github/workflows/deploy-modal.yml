name: Deploy AI Models to Modal

on:
  push:
    branches:
      - main
    paths:
      - 'server/ai_inference/**'

jobs:
  deploy-modal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Modal
        run: pip install modal

      - name: Deploy Whisper to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy server/ai_inference/whisper_modal.py
